name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python reproduce.py --replay
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-evidence
          path: |
            RESULTS_A.md
            RESULTS_B.md
            DECISION_MATRIX.md
            results/
